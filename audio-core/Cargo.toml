[package]
name = "audio-core"
version = "0.1.0"
edition = "2021"
description = "Cross-platform SF2 audio synthesis core for arvgrid (web WASM + desktop native)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# 完整 SF2 引擎（支持 generator + modulator + 滤波器包络 + LFO）
rustysynth = "1.3"
# WASM 绑定（仅 wasm32 target 时编译）
wasm-bindgen = { version = "0.2", optional = true }
# 多线程（仅非 wasm32 target，rayon 不支持 WASM）
rayon = { version = "1.10", optional = true }

[features]
default = []
# WASM 后端（网页端）：自动启用 wasm-bindgen
wasm = ["wasm-bindgen"]
# 原生后端（桌面端）：多线程
native = ["rayon"]

[profile.release]
# WASM 体积优化
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.release-native]
# 桌面端性能优化
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
