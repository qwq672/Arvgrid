[package]
name = "arvgrid-desktop"
version = "0.1.0"
description = "Arvgrid Desktop - Professional MIDI editor"
authors = ["qwq672"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 后续集成 audio-core + cpal + rayon
# audio-core = { path = "../../audio-core", features = ["native"] }
# cpal = "0.15"
# rayon = "1.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
