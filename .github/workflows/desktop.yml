name: Desktop

# 构建 Tauri 桌面端（Windows / macOS / Linux）
# v16：触发路径扩展到 src/public/audio-core——桌面壳打包的是 dist/，
# 前端修复（如 v14 设置黑屏 / v15 PianoRoll）同样需要重新出桌面安装包，
# 否则 artifact 会一直停在旧版本。
#
# v261117-1 起：tag 推送（v*）自动出 GitHub Release。
#   发版约定（与用户商定）：
#   - 日期版 tag  vYYMMDD-N（如 v261117-1）→ Pre-release，每轮改动例行发；
#   - 语义版 tag  vX.Y.Z（如 v1.0.0）→ 正式 release，仅在用户验证并
#     明确说“大部分功能已完善”之后才使用（平时绝不发正式版）。
# release job 在三平台构建完成后下载全部安装包，一次性挂到 release 上，
# 避免 243MB+ 的安装包走任何本地下载/上传链路（CI→CI 直传）。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'public/**'
      - 'audio-core/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # v16：cargo 缓存——tauri-cli 安装 + 依赖首次编译很重，
      # 不缓存每个 job 多花 10+ 分钟
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.toml', 'audio-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Download built-in SF2 (FluidR3_GM)
        shell: bash
        run: |
          chmod +x desktop/scripts/download-sf2.sh
          desktop/scripts/download-sf2.sh

      - name: Build frontend
        run: |
          npm install
          npx eslint src
          npm run build

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: arvgrid-desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: arvgrid-desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: arvgrid-desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30

  # ----------------------------------------------------------------
  # 发版 job：仅 tag 推送时运行。等三平台构建全部完成后，下载全部
  # 安装包并创建 GitHub Release（日期版 tag → Pre-release）。
  # ----------------------------------------------------------------
  release:
    name: Release (${{ github.ref_name }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: arvgrid-desktop-*
          path: bundles
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 发版约定：日期版 → Pre-release；语义版 → 正式 release
          PRERELEASE=false
          if [[ "$TAG" =~ ^v[0-9]{6}(-[0-9]+)?$ ]]; then
            PRERELEASE=true
            echo "日期版 tag → 标记为 Pre-release"
          else
            echo "语义版 tag → 正式 release"
          fi

          # 用 annotated tag 的正文作为 release 说明
          git fetch --tags --force
          git tag -l --format='%(contents:body)' "$TAG" > tag-notes.md || true
          if [ ! -s tag-notes.md ]; then
            echo "Arvgrid $TAG 桌面端安装包（Windows / macOS ARM / Linux，内置 FluidR3_GM 音色库）。" > tag-notes.md
          fi

          # 收集全部安装包（.app 是目录，跳过；.dmg 才是可分发格式）
          mapfile -t FILES < <(find bundles -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.dmg' \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::bundles/ 下没有找到任何安装包文件"
            exit 1
          fi
          echo "将上传 ${#FILES[@]} 个文件："
          printf '  %s\n' "${FILES[@]}"

          ARGS=(--title "Arvgrid $TAG" --notes-file tag-notes.md)
          if [ "$PRERELEASE" = true ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FILES[@]}" "${ARGS[@]}"
